<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Evolución Porra Completa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --accent: #38bdf8;
      }
      body {
        font-family: sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        margin: auto;
      }
      .nav-header {
        display: flex;
        align-items: center;
        gap: 15px;
        justify-content: center;
        margin-top: 20px;
      }
      .nav-btn {
        background: var(--accent);
        border: none;
        padding: 5px 15px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }
      canvas {
        background: #1e293b;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 30px;
        width: 100%;
        max-height: 450px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #334155;
        padding: 8px;
        text-align: center;
      }
      input {
        width: 40px;
        text-align: center;
      }
      .input-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        border: none;
        padding: 8px;
        border-radius: 4px;
        margin: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Evolución del Ranking</h1>

      <div class="nav-header">
        <button class="nav-btn" onclick="changeDate(-1)">◀</button>
        <h2 id="summaryTitle">Resumen Actual</h2>
        <button class="nav-btn" onclick="changeDate(1)">▶</button>
      </div>

      <table id="summaryTable" style="background: #1e293b; margin-bottom: 30px">
        <thead>
          <tr style="background: #334155">
            <th>Pos</th>
            <th>Participante</th>
            <th>Pts</th>
            <th>Plenos</th>
            <th>Tendencia</th>
            <th>Δ Pts</th>
            <th>Δ Plenos</th>
            <th>Dif. Superior</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>

      <h3>Posiciones</h3>
      <canvas id="evolucionChart"></canvas>
      <h3>Puntuación Absoluta</h3>
      <canvas id="puntosChart"></canvas>
      <h3>Puntos Ganados</h3>
      <canvas id="diferenciaChart"></canvas>

      <div id="controls">
        <button onclick="addRow()">+ Agregar Fecha</button>
        <button onclick="exportExcel()">📁 Exportar Excel</button>
        <button onclick="document.getElementById('fileInput').click()">
          📂 Importar Excel
        </button>
        <input
          type="file"
          id="fileInput"
          style="display: none"
          onchange="importExcel(event)"
          accept=".xlsx, .xls"
        />
      </div>

      <table id="dataTable">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>CFVELEZM</th>
            <th>ALEJANDRO_P</th>
            <th>ALEJANDRO_N</th>
            <th>ULIOCES</th>
            <th>ALEJANDRO_S</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <script>
      Chart.register(ChartDataLabels);
      const colors = ["#f87171", "#fbbf24", "#34d399", "#38bdf8", "#c084fc"];
      const participants = [
        "CFVELEZM",
        "ALEJANDRO_P",
        "ALEJANDRO_N",
        "ULIOCES",
        "ALEJANDRO_S",
      ];
      let data = [];//JSON.parse(localStorage.getItem("porraData")) || [];
      let currentIndex = -1; // -1 es el último registro

      async function loadInitialData() {
        if (data.length > 0) return;
        try {
          const response = await fetch("data.xlsx");
          if (!response.ok) return;
          const arrayBuffer = await response.arrayBuffer();
          const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: "array" });
          data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          renderTable();
        } catch (e) {}
      }

      function getRanking(row) {
        let participantsData = participants
          .map((p) => ({
            name: p,
            pts: parseInt(row[p + "_pts"]) || 0,
            pl: parseInt(row[p + "_pl"]) || 0,
          }))
          .sort((a, b) => b.pts - a.pts || b.pl - a.pl);

        
        // Asignamos posiciones considerando empates
        let ranked = [];
        let currentPos = 1;
        for (let i = 0; i < participantsData.length; i++) {
          if (
            i > 0 &&
            participantsData[i].pts === participantsData[i - 1].pts &&
            participantsData[i].pl === participantsData[i - 1].pl
          ) {
            // Es igual al anterior, mantiene la misma posición
            ranked.push({ ...participantsData[i], rank: ranked[i - 1].rank });
          } else {
            // Es distinto, su posición es i + 1
            ranked.push({ ...participantsData[i], rank: i + 1 });
          }
        }
        return ranked;
      }

      function changeDate(dir) {
          if (data.length === 0) return;
          currentIndex = (currentIndex + dir + data.length) % data.length;
          updateSummary();
      }

      function updateSummary() {
          const body = document.getElementById("summaryBody");
          const title = document.getElementById("summaryTitle");
          body.innerHTML = "";
          if (data.length === 0) return;
      
          const targetIdx = currentIndex === -1 ? data.length - 1 : currentIndex;
          title.innerText = `Resumen: ${data[targetIdx].fecha || "Jornada " + (targetIdx + 1)}`;
      
          const currentRank = getRanking(data[targetIdx]);
          const prevRank = targetIdx > 0 ? getRanking(data[targetIdx - 1]) : null;
      
          // --- NUEVO: Calculamos la diferencia de puntos de todos para hallar el máximo ---
          const diffs = currentRank.map(r => {
              const prevP = prevRank ? prevRank.find((p) => p.name === r.name) : null;
              return (prevP ? r.pts - prevP.pts : r.pts);
          });
          const maxDiff = Math.max(...diffs);
          // --------------------------------------------------------------------------------
      
          currentRank.forEach((r, i) => {
              const prevP = prevRank ? prevRank.find((p) => p.name === r.name) : null;
              const diffPos = prevP ? prevP.rank - r.rank : 0;
              
              // Calculamos la diferencia de puntos actual
              const deltaPts = r.pts - (prevP ? prevP.pts : 0);
              
              // --- NUEVO: Determinamos si esta celda es la que tiene el máximo ---
              const isMax = deltaPts === maxDiff && deltaPts > 0;
              const styleMax = isMax ? 'background: #fbbf24; color: #000; font-weight: bold; border-radius: 4px;' : '';
              // --------------------------------------------------------------------
      
              let tendencia = diffPos > 0 ? `⬆️ +${diffPos}` : diffPos < 0 ? `⬇️ ${diffPos}` : "🟰";
              let colorT = diffPos > 0 ? "#34d399" : diffPos < 0 ? "#f87171" : "#fff";
              const pPl = prevP ? prevP.pl : 0;
              const diffSuperior = i > 0 ? currentRank[i - 1].pts - r.pts : "-";
      
              body.innerHTML += `<tr>
                  <td>${r.rank}º</td>
                  <td>${r.name}</td>
                  <td>${r.pts}</td>
                  <td>${r.pl}</td>
                  <td style="color: ${colorT}">${tendencia}</td>
                  <td style="${styleMax}">${deltaPts}</td>
                  <td>${r.pl - pPl}</td>
                  <td>${diffSuperior}</td>
              </tr>`;
          });
      }

      function updateCharts() {
        const ctxs = ["evolucionChart", "puntosChart", "diferenciaChart"].map(
          (id) => document.getElementById(id).getContext("2d"),
        );
        if (window.charts) window.charts.forEach((c) => c.destroy());
        window.charts = [];

        let prevRow = null;
        const posData = participants.map(() => []),
          ptsData = participants.map(() => []),
          diffData = participants.map(() => []);

        data.forEach((row) => {
          let rankings = getRanking(row);
          participants.forEach((p, i) => {
            const pData = rankings.find((r) => r.name === p);
            const pts = parseInt(row[p + "_pts"]) || 0;
            // console.log(pData)
            posData[i].push(pData ? pData.rank : 1);
            ptsData[i].push(pts);
            diffData[i].push(
              prevRow ? pts - (parseInt(prevRow[p + "_pts"]) || 0) : pts,
            );
          });
          prevRow = row;
        });

        const labels = data.map((d) => d.fecha);
        // Configuración básica de gráficos (se mantiene tu estructura original)
        window.charts.push(
          new Chart(ctxs[0], {
            type: "line",
            data: {
              labels,
              datasets: participants.map((p, i) => ({
                label: p,
                data: posData[i],
                borderColor: colors[i],
                tension: 0.3,
              })),
            },
            options: {
              scales: {
                y: {
                  reverse: true,
                  min: 0,
                  max: 6,
                  ticks: { stepSize: 1, color: "#fff" },
                },
              },
              plugins: {
                datalabels: {
                  display: false,
                },
              },
            },
          }),
        );
        window.charts.push(
          new Chart(ctxs[1], {
            type: "line",
            data: {
              labels,
              datasets: participants.map((p, i) => ({
                label: p,
                data: ptsData[i],
                borderColor: colors[i],
              })),
            },
            options: {
              plugins: {
                datalabels: {
                  color: "#fff",
                  anchor: "end",
                  align: "top",
                  display: false,
                },
              },
              scales: {
                y: { ticks: { color: "#fff" } },
                x: { ticks: { color: "#fff" } },
              },
            },
          }),
        );
        window.charts.push(
          new Chart(ctxs[2], {
            type: "bar",
            data: {
              labels,
              datasets: participants.map((p, i) => ({
                label: p,
                data: diffData[i],
                backgroundColor: colors[i],
              })),
            },
            options: {
              plugins: {
                datalabels: {
                  color: "#fff", // Texto en negro
                  //backgroundColor: "rgba(255, 255, 255, 0.7)", // Fondo blanco traslúcido para legibilidad
                  borderRadius: 0,
                  anchor: "end",
                  align: "top",
                  rotation: 0, // Rotado para que entre en la barra
                  font: {
                    //weight: "bold",
                    size: 10,
                  },
                  // Aquí mostramos Nombre: Valor
                  formatter: (value, context) => {
                    const name =
                      context.chart.data.datasets[context.datasetIndex].label;
                    return value !== 0 ? `${value}` : "";
                  },
                },
              },
              scales: {
                y: { ticks: { color: "#fff" }, max: 45 },
                x: { ticks: { color: "#fff" } },
              },
            },
          }),
        );
      }

      function renderTable() {
        const body = document.getElementById("tableBody");
        body.innerHTML = "";
        data.forEach((row, index) => {
          let rowHtml = `<tr><td><input type="text" value="${row.fecha || ""}" onchange="updateRow(${index}, 'fecha', this.value)" style="width: 70px;"></td>`;
          participants.forEach((p) => {
            rowHtml += `<td><div class="input-group"><input type="number" value="${row[p + "_pts"] || 0}" onchange="updateRow(${index}, '${p}_pts', this.value)"><input type="number" value="${row[p + "_pl"] || 0}" onchange="updateRow(${index}, '${p}_pl', this.value)" style="color:#1e293b;"></div></td>`;
          });
          rowHtml += `<td><button onclick="deleteRow(${index})">❌</button></td></tr>`;
          body.innerHTML += rowHtml;
        });
        updateSummary();
        updateCharts();
        localStorage.setItem("porraData", JSON.stringify(data));
      }

      function updateRow(i, k, v) {
        data[i][k] = v;
        renderTable();
      }
      function deleteRow(i) {
        data.splice(i, 1);
        renderTable();
      }
      function addRow() {
        data.push({ fecha: "00/00" });
        renderTable();
      }
      function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Datos");
        XLSX.writeFile(wb, "porra_datos.xlsx");
      }
      function importExcel(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          data = XLSX.utils.sheet_to_json(
            XLSX.read(ev.target.result, { type: "array" }).Sheets[0],
          );
          renderTable();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
      }

      loadInitialData().then(() => renderTable());
    </script>
  </body>
</html>
