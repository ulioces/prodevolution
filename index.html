<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Evolución Porra Completa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --accent: #38bdf8;
      }
      body {
        font-family: sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        margin: auto;
      }
      canvas {
        background: #1e293b;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 30px;
        width: 100%;
        max-height: 450px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #334155;
        padding: 8px;
        text-align: center;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        border: none;
        padding: 8px;
        border-radius: 4px;
        margin: 2px;
      }
      .input-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
      }
      input {
        width: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Evolución del Ranking</h1>

      <h2>Resumen Actual</h2>
      <table id="summaryTable" style="background: #1e293b; margin-bottom: 30px">
        <thead>
          <tr style="background: #334155">
            <th>Pos</th>
            <th>Participante</th>
            <th>Pts</th>
            <th>Plenos</th>
            <th>Tendencia</th>
            <th>Δ Pts</th>
            <th>Δ Plenos</th>
            <th>Dif. Superior</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>

      <h3>Posiciones</h3>
      <canvas id="evolucionChart"></canvas>
      <h3>Puntuación Absoluta</h3>
      <canvas id="puntosChart"></canvas>
      <h3>Puntos Ganados</h3>
      <canvas id="diferenciaChart"></canvas>

      <div id="controls">
        <button onclick="addRow()">+ Agregar Fecha</button>
        <button onclick="exportExcel()">📁 Exportar Excel</button>
        <button onclick="document.getElementById('fileInput').click()">
          📂 Importar Excel
        </button>
        <input
          type="file"
          id="fileInput"
          style="display: none"
          onchange="importExcel(event)"
          accept=".xlsx, .xls"
        />
      </div>

      <table id="dataTable">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>CFVELEZM</th>
            <th>ALEJANDRO_P</th>
            <th>ALEJANDRO_N</th>
            <th>ULIOCES</th>
            <th>ALEJANDRO_S</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <script>
      Chart.register(ChartDataLabels);
      const colors = ["#f87171", "#fbbf24", "#34d399", "#38bdf8", "#c084fc"];
      const participants = [
        "CFVELEZM",
        "ALEJANDRO_P",
        "ALEJANDRO_N",
        "ULIOCES",
        "ALEJANDRO_S",
      ];
      let data = [];//JSON.parse(localStorage.getItem("porraData")) || [];

      // Nueva función para cargar archivo inicial
      async function loadInitialData() {
        if (data.length > 0) return; // No cargar si ya hay datos locales
        try {
          const response = await fetch("data.xlsx");
          if (!response.ok) return;
          const arrayBuffer = await response.arrayBuffer();
          const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: "array" });
          data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          renderTable();
          console.log("Leyo el archivo.");
        } catch (e) {
          console.log("Archivo inicial no encontrado o error al cargar.");
        }
      }

      function getRanking(row) {
        // Obtenemos los datos, pero mantenemos la estructura original para procesar empates
        let participantsData = participants.map((p) => ({
          name: p,
          pts: parseInt(row[p + "_pts"]) || 0,
          pl: parseInt(row[p + "_pl"]) || 0,
        }));

        // Ordenamos primero para definir jerarquía
        participantsData.sort((a, b) => b.pts - a.pts || b.pl - a.pl);

        // Asignamos posiciones considerando empates
        let ranked = [];
        let currentPos = 1;
        for (let i = 0; i < participantsData.length; i++) {
          if (
            i > 0 &&
            participantsData[i].pts === participantsData[i - 1].pts &&
            participantsData[i].pl === participantsData[i - 1].pl
          ) {
            // Es igual al anterior, mantiene la misma posición
            ranked.push({ ...participantsData[i], rank: ranked[i - 1].rank });
          } else {
            // Es distinto, su posición es i + 1
            ranked.push({ ...participantsData[i], rank: i + 1 });
          }
        }
        return ranked;
      }

      function updateSummary() {
        const body = document.getElementById("summaryBody");
        body.innerHTML = "";
        if (data.length === 0) return;

        const currentRank = getRanking(data[data.length - 1]);
        const prevRank =
          data.length > 1 ? getRanking(data[data.length - 2]) : null;

        currentRank.forEach((r, i) => {
          const currentPos = i + 1;
          const prevPos = prevRank
            ? prevRank.findIndex((p) => p.name === r.name) + 1
            : currentPos;
          const diffPos = prevPos - currentPos;

          let tendencia = "🟰";
          let colorT = "#fff";
          if (diffPos > 0) {
            tendencia = `⬆️ +${diffPos}`;
            colorT = "#34d399";
          } else if (diffPos < 0) {
            tendencia = `⬇️ ${diffPos}`;
            colorT = "#f87171";
          }

          const prevData = data.length > 1 ? data[data.length - 2] : {};
          const pPts = parseInt(prevData[r.name + "_pts"]) || 0;
          const pPl = parseInt(prevData[r.name + "_pl"]) || 0;
          const diffSuperior = i > 0 ? currentRank[i - 1].pts - r.pts : "-";

          body.innerHTML += `<tr>
                <td>${currentPos}º</td><td>${r.name}</td><td>${r.pts}</td><td>${r.pl}</td>
                <td style="color: ${colorT}">${tendencia}</td>
                <td>${r.pts - pPts}</td><td>${r.pl - pPl}</td><td>${diffSuperior}</td>
            </tr>`;
        });
      }

      function updateCharts() {
        const ctxs = ["evolucionChart", "puntosChart", "diferenciaChart"].map(
          (id) => document.getElementById(id).getContext("2d"),
        );
        if (window.charts) window.charts.forEach((c) => c.destroy());
        window.charts = [];

        let prevRow = null;
        const posData = participants.map(() => []),
          ptsData = participants.map(() => []),
          diffData = participants.map(() => []);

        data.forEach((row) => {
          let rankings = getRanking(row); // Ahora ya trae la propiedad .rank
          participants.forEach((p, i) => {
            const pData = rankings.find(r => r.name === p);
            const rank = pData ? pData.rank : 1; 
            const pts = parseInt(row[p + "_pts"]) || 0;
            
            posData[i].push(rank);
            ptsData[i].push(pts);
            diffData[i].push(prevRow ? pts - (parseInt(prevRow[p + "_pts"]) || 0) : pts);
          });
          prevRow = row;
        });

        const labels = data.map((d) => d.fecha);
        window.charts.push(
          new Chart(ctxs[0], {
            type: "line",
            data: {
              labels,
              datasets: participants.map((p, i) => ({
                label: p,
                data: posData[i],
                borderColor: colors[i],
                tension: 0.3,
              })),
            },
            options: {
              scales: {
                y: {
                  reverse: true,
                  min: 0,
                  max: 6,
                  ticks: { stepSize: 1, color: "#fff" },
                },
                x: { ticks: { color: "#fff" } },
              },
            },
          }),
        );
        window.charts.push(
          new Chart(ctxs[1], {
            type: "line",
            data: {
              labels,
              datasets: participants.map((p, i) => ({
                label: p,
                data: ptsData[i],
                borderColor: colors[i],
                tension: 0.3,
              })),
            },
            options: {
              plugins: {
                datalabels: {
                  color: "#fff",
                  anchor: "end",
                  align: "top",
                  display: false,
                },
              },
              scales: {
                y: { ticks: { color: "#fff" } },
                x: { ticks: { color: "#fff" } },
              },
            },
          }),
        );
        window.charts.push(
          new Chart(ctxs[2], {
            type: "bar",
            data: {
              labels,
              datasets: participants.map((p, i) => ({
                label: p,
                data: diffData[i],
                backgroundColor: colors[i],
              })),
            },
            options: {
              plugins: {
                datalabels: {
                  color: "#fff", // Texto en negro
                  //backgroundColor: "rgba(255, 255, 255, 0.7)", // Fondo blanco traslúcido para legibilidad
                  borderRadius: 0,
                  anchor: "end",
                  align: "top",
                  rotation: 0, // Rotado para que entre en la barra
                  font: {
                    //weight: "bold",
                    size: 10,
                  },
                  // Aquí mostramos Nombre: Valor
                  formatter: (value, context) => {
                    const name =
                      context.chart.data.datasets[context.datasetIndex].label;
                    return value !== 0 ? `${value}` : "";
                  },
                },
              },
              scales: {
                y: { ticks: { color: "#fff" }, max: 45 },
                x: { ticks: { color: "#fff" } },
              },
            },
          }),
        );
      }

      function renderTable() {
        const body = document.getElementById("tableBody");
        body.innerHTML = "";
        data.forEach((row, index) => {
          let rowHtml = `<tr><td><input type="text" value="${row.fecha || ""}" onchange="updateRow(${index}, 'fecha', this.value)" style="width: 70px;"></td>`;
          participants.forEach((p) => {
            rowHtml += `<td><div class="input-group">
                <input type="number" value="${row[p + "_pts"] || 0}" onchange="updateRow(${index}, '${p}_pts', this.value)">
                <input type="number" value="${row[p + "_pl"] || 0}" onchange="updateRow(${index}, '${p}_pl', this.value)" style="color:#38bdf8;">
            </div></td>`;
          });
          rowHtml += `<td><button onclick="deleteRow(${index})">❌</button></td></tr>`;
          body.innerHTML += rowHtml;
        });
        updateSummary();
        updateCharts();
        localStorage.setItem("porraData", JSON.stringify(data));
      }

      function updateRow(i, k, v) {
        data[i][k] = v;
        renderTable();
      }
      function deleteRow(i) {
        data.splice(i, 1);
        renderTable();
      }
      function addRow() {
        data.push({ fecha: "00/00" });
        renderTable();
      }
      function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Datos");
        XLSX.writeFile(wb, "porra_datos.xlsx");
      }
      function importExcel(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const wb = XLSX.read(ev.target.result, { type: "array" });
          data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          renderTable();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
      }
      //renderTable();

      loadInitialData().then(() => renderTable());
    </script>
  </body>
</html>
